version: "3.8"

services:
  # Lite dataset (18 DBs, 300 tasks) — default
  postgresql:
    image: docker.io/shawnxxh/bird-interact-postgresql:latest
    container_name: bird_interact_postgresql
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123123
      TZ: "Asia/Hong_Kong"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    command:
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
    ports:
      - "5432:5432"

  # Full dataset (26 DBs, 600 tasks) — use with DATASET=full
  postgresql_full:
    image: docker.io/shawnxxh/bird-interact-postgresql-full:latest
    container_name: bird_interact_postgresql_full
    profiles: ["full"]
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123123
      TZ: "Asia/Hong_Kong"
    volumes:
      - postgresql_data_full:/var/lib/postgresql/data
    command:
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
    ports:
      - "5433:5432"

  neo4j:
    image: docker.io/library/neo4j:5.26-community
    container_name: bird_interact_neo4j
    profiles: ["kg"]
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-bird-interact-dev}"
      NEO4J_server_memory_heap_initial__size: "128m"
      NEO4J_server_memory_heap_max__size: "256m"
      NEO4J_server_memory_pagecache_size: "128m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "bash -c 'echo > /dev/tcp/127.0.0.1/7474' >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s

volumes:
  postgresql_data:
  postgresql_data_full:
  neo4j_data:
  neo4j_logs:
