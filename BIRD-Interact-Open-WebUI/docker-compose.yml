services:
  # Open WebUI gateway for the remote OpenAI-compatible vLLM server.
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0
    container_name: bird_interact_open_webui
    environment:
      ENABLE_API_KEYS: "True"
      ENABLE_OPENAI_API: "True"
      OPENAI_API_BASE_URLS: "${OPENAI_API_BASE_URLS:-http://192.168.1.233:8000/v1}"
      OPENAI_API_KEYS: "${OPENAI_API_KEYS:-}"
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - open_webui_data:/app/backend/data
    restart: unless-stopped

  # Lite dataset (18 DBs, 300 tasks) — default
  postgresql:
    image: docker.io/shawnxxh/bird-interact-postgresql:latest
    container_name: bird_interact_postgresql
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123123
      TZ: "Asia/Hong_Kong"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    command:
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
    ports:
      - "5432:5432"

  # Full dataset (26 DBs, 600 tasks) — use with DATASET=full
  postgresql_full:
    image: docker.io/shawnxxh/bird-interact-postgresql-full:latest
    container_name: bird_interact_postgresql_full
    profiles: ["full"]
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123123
      TZ: "Asia/Hong_Kong"
    volumes:
      - postgresql_data_full:/var/lib/postgresql/data
    command:
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
    ports:
      - "5433:5432"

volumes:
  open_webui_data:
  postgresql_data:
  postgresql_data_full:
